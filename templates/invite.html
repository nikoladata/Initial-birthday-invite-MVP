<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>{{ wedding.groom }} & {{ wedding.bride }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="card">
        <p class="small">Позивница за венчање</p>

        <h1>{{ wedding.groom }} & {{ wedding.bride }}</h1>

        <p class="message">{{ wedding.message }}</p>

        <div class="details">
            <p><strong>Датум:</strong> {{ wedding.date }}</p>
            <p><strong>Време:</strong> {{ wedding.time }}</p>
            <p><strong>Црква:</strong> {{ wedding.church }}</p>
            <p><strong>Прослава:</strong> {{ wedding.restaurant }}</p>
            <p><strong>Адреса:</strong> {{ wedding.address }}</p>
        </div>

        <div class="buttons">
            <a href="{{ wedding.maps_url }}" target="_blank">Погледај мапу</a>
            <a href="{{ wedding.form_url }}" target="_blank">Потврди долазак</a>
        </div>
    </main>
</body>
</html>
